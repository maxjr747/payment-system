<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay Now</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      color: #1f2937;
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    p {
      margin: 0 0 20px;
      color: #6b7280;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 600;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 12px;
    }
    input {
      border: 1px solid #d1d5db;
      padding: 14px;
      outline: none;
    }
    input:focus {
      border-color: #111827;
    }
    button {
      margin-top: 18px;
      border: 0;
      padding: 14px;
      background: #111827;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      min-height: 24px;
      font-size: 14px;
    }
    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
    }
    .meta {
      margin-top: 12px;
      font-size: 12px;
      color: #374151;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Send Payment</h1>
      <p>Enter the amount and continue to the payment page.</p>

      <form id="payForm">
        <label for="amount">Amount (USD)</label>
        <input id="amount" type="number" min="1" step="0.01" placeholder="25.00" required />

        <label for="customerName">Customer Name</label>
        <input id="customerName" type="text" placeholder="Optional" />

        <button id="payBtn" type="submit">Continue to Pay</button>
      </form>

      <div class="status" id="status"></div>
      <div class="meta" id="meta"></div>
      <div class="note">This page calls your server, creates an order, fetches the cashier URL, then redirects automatically.</div>
    </div>
  </div>

  <script>
    const form = document.getElementById("payForm");
    const button = document.getElementById("payBtn");
    const statusBox = document.getElementById("status");
    const metaBox = document.getElementById("meta");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const amount = document.getElementById("amount").value;
      const customerName = document.getElementById("customerName").value;

      statusBox.textContent = "";
      metaBox.textContent = "";
      button.disabled = true;
      button.textContent = "Creating payment...";

      try {
        const response = await fetch("/api/pay", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ amount, customerName })
        });

        const data = await response.json();

        if (!response.ok || !data.paymentUrl) {
          throw new Error(data.error || "Failed to create payment.");
        }

        statusBox.textContent = "Redirecting to payment page...";
        metaBox.textContent = data.orderNo ? `Order: ${data.orderNo}` : "";

        window.location.href = data.paymentUrl;
      } catch (error) {
        statusBox.textContent = error.message || "Something went wrong.";
      } finally {
        button.disabled = false;
        button.textContent = "Continue to Pay";
      }
    });
  </script>
</body>
</html>
